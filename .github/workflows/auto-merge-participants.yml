name: Auto-merge participant practice PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR only touches practice/participants/
        id: filecheck
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            const outside = files.filter(f => !f.filename.startsWith('practice/participants/'));
            if (files.length === 0 || outside.length > 0) {
              core.setFailed('PR touches files outside practice/participants/ — leaving for manual review.');
            } else {
              core.info(`OK: ${files.length} file(s), all within practice/participants/`);
            }

      - name: Enable auto-merge (squash)
        if: success()
        run: gh pr merge --auto --squash "${{ github.event.pull_request.html_url }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
